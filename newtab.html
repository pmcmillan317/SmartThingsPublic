<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OPMS Hub</title>

    <!-- Local Tailwind CSS (Compiled) -->
    <link rel="stylesheet" href="lib/styles.css">

    <!-- Local React & ReactDOM -->
    <script src="lib/react.js"></script>
    <script src="lib/react-dom.js"></script>


    <!-- FontAwesome (Note: Still CDN, user might need to download fonts locally for full offline support) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background-color: #f3f4f6;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            transition: background-image 0.5s ease-in-out;
            -webkit-tap-highlight-color: transparent;
        }
        /* Overlay to ensure text readability on busy backgrounds */
        .bg-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(243, 244, 246, 0.85); /* Default tint */
            z-index: -1;
            transition: background 0.5s ease;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }

        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .dock-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }
        .widget-animate { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .shake { animation: shake 2s cubic-bezier(.36,.07,.19,.97) infinite both; }
        @keyframes shake {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(0.5deg); }
            75% { transform: rotate(-0.5deg); }
        }
        .accordion-content { transition: max-height 0.3s ease-in-out, opacity 0.3s ease-in-out; }
    </style>
</head>
<body class="text-slate-800 min-h-screen selection:bg-indigo-100 selection:text-indigo-700 overflow-x-hidden">
    <div class="bg-overlay" id="bg-overlay"></div>
    <div id="root"></div>

    <!-- Main Application Logic (ES Module) -->
    <script type="module" src="newtab.js"></script>
</body>
</html>
